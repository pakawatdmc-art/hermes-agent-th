platform.google_chat.setup_files.not_configured: "🔧 **ยังไม่ได้ตั้งค่า**การส่งไฟล์แนบผ่านระบบโดยตรง\n**ขั้นที่ 1 (ครั้งเดียว
  บนเครื่องโฮสต์):** สร้างข้อมูลรับรองไคลเอนต์ OAuth ที่ https://console.cloud.google.com/apis/credentials → *Create credentials*
  → *OAuth client ID* → *Desktop app* แล้วดาวน์โหลด JSON จากนั้นเรียกคำสั่งนี้บนเครื่องโฮสต์:\n```\npython -m plugins.platforms.google_chat.oauth
  --client-secret /path/to/client_secret.json\n```\n**ขั้นที่ 2:** กลับมาที่นี่แล้วส่ง `/setup-files start`"
platform.google_chat.setup_files.start_instructions: "1. เปิด URL นี้ในเบราว์เซอร์และให้สิทธิ์:\n{auth_url}\n\n2. หลังคลิก
  *Allow* เบราว์เซอร์จะโหลด `http://localhost:1/?...&code=...` ไม่สำเร็จ ซึ่งเป็นขั้นตอนปกติ\n\n3. คัดลอก URL ทั้งหมดที่โหลดไม่สำเร็จจากแถบที่อยู่
  แล้ววางกลับที่นี่ในรูปแบบ `/setup-files <PASTE_URL>` (หรือเฉพาะค่าของ `code=...`)\n\nเคล็ดลับ: URL มีสิทธิ์เข้าถึงของคุณ
  โปรดเก็บเป็นความลับ"
platform.google_chat.setup_files.start_failed: ❌ สร้าง URL สำหรับ OAuth ไม่ได้ ตรวจบันทึกเกตเวย์และตรวจสอบว่า
