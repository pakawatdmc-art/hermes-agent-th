cli.setup.help.examples: "\nตัวอย่าง:\n    hermes                        เริ่มสนทนาแบบโต้ตอบ\n    hermes chat -q \"สวัสดี\"        ส่งคำถามครั้งเดียว\n    hermes --tui                  เปิดหน้าจอ Terminal แบบใหม่\n    hermes --cli                  เปิดหน้าจอ Terminal แบบคลาสสิก\n    hermes -c                     สนทนาต่อจากครั้งล่าสุด\n    hermes -c \"งานของฉัน\"          สนทนาต่อตามชื่อบทสนทนา\n    hermes --resume <session_id>  สนทนาต่อจากรหัสบทสนทนาที่ระบุ\n    hermes --resume latest        สนทนาต่อจากครั้งล่าสุด (เหมือน -c)\n    hermes --tui --resume latest --in ./dir   สนทนาต่อจากงานล่าสุดใน ./dir ด้วย TUI\n    hermes setup                  เปิดตัวช่วยตั้งค่า\n    hermes logout                 ล้างข้อมูลเข้าสู่ระบบที่บันทึกไว้\n    hermes auth add <provider>    เพิ่มข้อมูลเข้าสู่ระบบในกลุ่มบัญชี\n    hermes auth list              ดูข้อมูลเข้าสู่ระบบในกลุ่มบัญชี\n    hermes auth remove <p> <t>    นำข้อมูลเข้าสู่ระบบออกตามลำดับ รหัส หรือชื่อ\n    hermes auth reset <p> [t]     ล้างสถานะโควตาหมดของผู้ให้บริการหรือบัญชี\n    hermes auth priority <p> <t> <n>  เปลี่ยนลำดับบัญชีเป็น n (0 = ลองก่อน)\n    hermes auth refresh <p> [t]   ต่ออายุ OAuth และล้างช่วงพักบัญชี\n    hermes model                  เลือกโมเดลเริ่มต้น\n    hermes fallback [list]        ดูลำดับผู้ให้บริการสำรอง\n    hermes fallback add           เพิ่มผู้ให้บริการสำรอง\n    hermes fallback remove        นำผู้ให้บริการสำรองออก\n    hermes config                 ดูการตั้งค่า\n    hermes config edit            เปิดการตั้งค่าใน $EDITOR\n    hermes config set model gpt-4 กำหนดค่าการตั้งค่า\n    hermes gateway                เริ่มเกตเวย์เชื่อมแอปแชต\n    hermes gateway install        ติดตั้งบริการเกตเวย์เบื้องหลัง\n    hermes gateway start          เริ่มบริการเกตเวย์ที่ติดตั้งไว้\n    hermes gateway stop           หยุดบริการเกตเวย์\n    hermes gateway status         ดูสถานะบริการเกตเวย์\n    hermes -p <profile> <cmd>     รันคำสั่งด้วยโปรไฟล์ที่ระบุ (หรือ --profile)\n                                  เช่น hermes -p coder gateway stop\n    hermes -s hermes-agent-dev,github-auth\n    hermes -w                     เริ่มใน Git worktree แยก\n    hermes sessions list          ดูรายการบทสนทนาเก่า\n    hermes sessions browse        เปิดตัวเลือกบทสนทนา\n    hermes sessions rename ID T   เปลี่ยนชื่อบทสนทนา\n    hermes logs                   ดู agent.log 50 บรรทัดล่าสุด\n    hermes logs -f                ติดตาม agent.log แบบต่อเนื่อง\n    hermes logs errors            ดู errors.log\n    hermes logs --since 1h        ดูบันทึกในชั่วโมงล่าสุด\n    hermes debug share            อัปโหลดรายงานวิเคราะห์เพื่อขอความช่วยเหลือ\n    hermes console                เปิดคอนโซลคำสั่งที่ปลอดภัยของ Hermes\n    hermes update                 อัปเดตเป็นรุ่นล่าสุด\n    hermes dashboard              เปิดแดชบอร์ดเว็บ (พอร์ต 9119)\n    hermes dashboard --stop       หยุดแดชบอร์ดที่ทำงานอยู่\n    hermes dashboard --status     ดูแดชบอร์ดที่ทำงานอยู่\n\nดูคำอธิบายเพิ่มเติมของแต่ละคำสั่ง:\n    hermes <command> --help\n"
