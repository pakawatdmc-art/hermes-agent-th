  /model'
explainer.exit.all_retries_exhausted_no_response: ผู้ให้บริการโมเดลไม่ตอบกลับหลังจากลองซ้ำครบแล้ว ส่ง /retry
  หรือเปลี่ยนโมเดลด้วย /model
explainer.exit.partial_stream_recovery: การส่งข้อความแบบสตรีมหยุดก่อนจบ และกู้คืนคำตอบได้เพียงบางส่วน ส่ง `continue`
  เพื่อให้ทำต่อจากจุดที่หยุด
explainer.exit.fallback_prior_turn_content: ไม่มีเนื้อหาใหม่ในรอบนี้ จึงแสดงบริบทก่อนหน้าที่กู้คืนได้ ส่ง `continue`
  เพื่อลองอีกครั้ง
explainer.exit.redirect_restart_limit_exceeded: คำขอถูกยกเลิกด้วยข้อความแก้ไขใหม่ทุกครั้งที่ลอง
  จึงหยุดรอบนี้เพื่อไม่ให้ลองซ้ำไม่สิ้นสุด ข้อความแก้ไขล่าสุดของคุณอยู่ในคิวเป็นข้อความถัดไปแล้ว
explainer.exit.rebuilt_restart_limit_exceeded: ผู้ให้บริการทุกรายในลำดับสำรองยังคงใช้งานไม่สำเร็จ
  จึงหยุดรอบนี้เพื่อไม่ให้ลองซ้ำไม่สิ้นสุด ส่ง `continue` หรือเปลี่ยนผู้ให้บริการ
explainer.exit.budget_exhausted: ใช้จำนวนรอบหรืองบค่าใช้จ่ายของรอบนี้ครบแล้วก่อนจะได้คำตอบสุดท้าย ส่ง `continue`
  เพื่อทำต่อ
explainer.exit.ollama_runtime_context_too_small: ขนาดบริบทของโมเดลในเครื่องเล็กเกินกว่าจะทำงานให้เสร็จ
  เพิ่มขนาดบริบทหรือใช้โมเดลที่ใหญ่ขึ้น
explainer.exit.pending_tool_result: รอบนี้หยุดระหว่างรอผลจากเครื่องมือ และโมเดลยังไม่ได้ส่งข้อความต่อ ส่ง `continue`
  เพื่อให้โมเดลสรุปผล
explainer.exit.interrupted_during_api_call: คำขอถูกขัดจังหวะระหว่างเรียกใช้โมเดลก่อนจะได้รับคำตอบ ส่ง `continue`
  เพื่อลองอีกครั้ง
explainer.exit.max_iterations_reached: ถึงจำนวนรอบเรียกใช้เครื่องมือสูงสุดก่อนจะได้คำตอบสุดท้าย ส่ง `continue`
  เพื่อทำต่อ หรือเพิ่ม `max_iterations`
explainer.exit.error_near_max_iterations: เกิดข้อผิดพลาดใกล้ถึงจำนวนรอบสูงสุดก่อนจะได้คำตอบสุดท้าย
  ตรวจผลจากเครื่องมือด้านบน แล้วส่ง `continue`
explainer.exit.repeated_outer_errors: รอบนี้เกิดข้อผิดพลาดซ้ำหลายครั้ง จึงหยุดก่อนเพื่อไม่ให้ลองซ้ำไม่สิ้นสุด
  ตรวจข้อผิดพลาดด้านบน แล้วส่ง `continue` เพื่อลองอีกครั้ง
explainer.persistence.compression: หยุดรอบนี้เนื่องจากโพรเซสอื่นกำลังบีบอัดบทสนทนานี้ ข้อความของคุณควรถูกบันทึกไว้แล้ว
  โปรดส่งอีกครั้งเมื่อบีบอัดเสร็จ
explainer.persistence.compression_closed: หยุดรอบนี้เนื่องจากการบีบอัดบริบทเปลี่ยนบทสนทนาไปยังบทสนทนาต่อเนื่อง
  และไม่สามารถเชื่อมต่อไปยังบทสนทนานั้นได้ ระบบจัดเก็บยังปกติ รีเฟรชแอปหรือเริ่มรอบใหม่เพื่อใช้รหัสบทสนทนาใหม่
  แล้วส่งข้อความอีกครั้ง
explainer.persistence.turn_lease: หยุดรอบนี้เนื่องจากโพรเซส Hermes อื่นรับช่วงบทสนทนานี้ คำตอบของคุณไม่ได้ถูกบันทึก
  รอให้โพรเซสอื่นทำงานเสร็จ แล้วส่งข้อความอีกครั้ง
explainer.persistence.session_row_missing: บทสนทนานี้ถูกลบจากระบบจัดเก็บขณะที่แชตยังเปิดอยู่ และ Hermes
  ไม่สามารถสร้างกลับได้ จึงไม่ได้บันทึกข้อความนี้ ส่งข้อความอีกครั้ง หากยังไม่สำเร็จ ให้เรียกใช้ `hermes
  {profile_arg}doctor`
explainer.persistence.locked: หยุดรอบนี้เนื่องจากระบบจัดเก็บบทสนทนาไม่ว่าง โพรเซส Hermes อื่นกำลังเขียนฐานข้อมูลสถานะ
  ข้อความของคุณควรถูกบันทึกไว้แล้ว โปรดรอสักครู่แล้วส่งอีกครั้ง
explainer.persistence.replaced: ไฟล์ฐานข้อมูลบทสนทนาถูกแทนที่ระหว่างที่ Hermes ทำงาน จึงไม่ได้บันทึกข้อความนี้
  โดยเก็บสำเนาไว้ใน {home}/sessions/ หยุด Hermes ด้วย `hermes {profile_arg}gateway stop` แล้วเรียกใช้ `hermes
  {profile_arg}doctor` — ห้ามใช้ `hermes {profile_arg}doctor --fix` เพราะจะซ่อมไฟล์ผิดไฟล์โดยตรง —
  จากนั้นเริ่มระบบใหม่และส่งข้อความอีกครั้ง ขั้นตอนกู้คืนขั้นสูงอยู่ในบันทึกเหตุการณ์
explainer.persistence.deleted_wal: 'โพรเซส Hermes อื่นยังถือสำเนาเก่าของบันทึกการเขียนล่วงหน้า (WAL) ของฐานข้อมูลบทสนทนา Hermes
  จึงหยุดเขียนเพื่อรักษาไฟล์ และไม่ได้บันทึกข้อความนี้ โดยเก็บสำเนาไว้ใน {home}/sessions/ ไม่มีข้อมูลสูญหาย ปิดโพรเซส Hermes
  ทั้งหมดของโปรไฟล์นี้ รวมถึงแอป Desktop, `hermes {profile_arg}gateway stop`, แดชบอร์ด และ cron แล้วเรียกใช้ `hermes {profile_arg}doctor`
  เพื่อดูว่าโพรเซสใดยังถือบันทึกอยู่ จากนั้นเริ่ม Hermes ใหม่และส่งข้อความอีกครั้ง ห้ามเรียกใช้ `doctor --fix` หรือลบไฟล์
  state.db ขณะที่โพรเซสเหล่านั้นทำงาน คู่มือ: {recovery_docs}'
explainer.persistence.corrupt: "หยุดรอบนี้เนื่องจากฐานข้อมูลสถานะรายงานความเสียหายของโครงสร้าง หากทำต่อ ประวัติจะสูญหายเมื่อเริ่มระบบใหม่
  การเพิ่มพื้นที่ดิสก์ไม่ช่วยแก้ปัญหานี้ วิธีการกู้คืน:\n1. เรียกใช้ `hermes {profile_arg}doctor --fix`\n2. หยุดเกตเวย์ แล้วกู้คืนด้วย:\n\
  \   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (หากรายงานว่ากู้คืนได้) hermes {profile_arg}sessions
  recover --source {db_path} --output recovered-state.db\n   — ระบบจะเก็บสำเนาไฟล์ที่เสียหายก่อนกู้คืน ห้ามเรียกใช้ `sqlite3
  ... \".recover\"` กับ state.db ที่กำลังใช้งาน เพราะ sqlite3 CLI รุ่นที่มีช่องโหว่อาจทำให้ไฟล์เสียหายมากขึ้น\n3. คืนค่าจากไฟล์สำรองใน
  {backups_dir}/\nจากนั้นส่งข้อความอีกครั้ง"
explainer.persistence.fts_index: หยุดรอบนี้เนื่องจากดัชนีค้นหาบทสนทนา (FTS5) เสียหายและไม่สามารถแยกออกได้
  จึงไม่ได้บันทึกข้อความนี้ ตัวข้อมูลข้อความไม่ได้เสียหาย ห้ามเรียกใช้เครื่องมือกู้คืนหรือคืนค่าจากไฟล์สำรอง เรียกใช้
  `hermes {profile_arg}doctor --fix` หรือเริ่ม Hermes ใหม่เพื่อซ่อมดัชนีตอนเปิด แล้วส่งข้อความอีกครั้ง
explainer.persistence.disk: Hermes ไม่สามารถบันทึกบทสนทนานี้ลงดิสก์ได้ จึงหยุดเพื่อป้องกันข้อความสูญหาย ดิสก์อาจเต็ม
  เพิ่มพื้นที่ว่างหรือแก้สิทธิ์การเข้าถึง {home}/state.db แล้วส่งข้อความอีกครั้ง
explainer.persistence.default: Hermes ไม่สามารถบันทึกบทสนทนานี้ได้ จึงหยุดเพื่อป้องกันข้อความสูญหาย
  อาจเกิดจากพื้นที่ดิสก์เต็มหรือโพรเซส Hermes อื่นกำลังถือฐานข้อมูลอยู่ ปิดหน้าต่าง Hermes อื่น เรียกใช้ `hermes
  {profile_arg}doctor` เพื่อตรวจระบบจัดเก็บ แล้วส่งข้อความอีกครั้ง
explainer.file_mutation.header: '⚠️ การตรวจสอบการแก้ไขไฟล์: มีการแก้ไขไฟล์ {count} รายการที่ไม่สำเร็จในรอบนี้ แม้ข้อความด้านบนอาจระบุเป็นอย่างอื่น
  เรียกใช้ `git status` หรือ `read_file` เพื่อตรวจว่าการเปลี่ยนแปลงใดถูกบันทึกจริง'
explainer.file_mutation.entry: '  • `{path}` — [{tool}] {preview}'
explainer.file_mutation.failed: ไม่สำเร็จ
explainer.shared.and_more: '  • … และอีก {count} รายการ'
explainer.shared.the_model: โมเดล
tips.t001: /bg <prompt> เรียกงานในบทสนทนาแยกเพื่อให้บทสนทนาปัจจุบันว่าง; /btw <question>
  ตอบคำถามแทรกเกี่ยวกับบทสนทนานี้โดยไม่ขัดจังหวะ
tips.t002: /branch แยกบทสนทนาปัจจุบันเป็นอีกสาขา เพื่อสำรวจแนวทางอื่นโดยไม่สูญเสียงานที่ทำไว้
tips.t003: /compress บีบอัดบริบทบทสนทนาด้วยตนเองเมื่อบทสนทนายาวขึ้น
tips.t004: /rollback แสดงจุดคืนค่าระบบไฟล์ — คืนไฟล์ที่เอเจนต์แก้ไขกลับสู่สถานะก่อนหน้าได้
tips.t005: /rollback diff 2 แสดงสิ่งที่เปลี่ยนหลังจุดคืนค่า 2 โดยยังไม่คืนค่า
tips.t006: /rollback 2 src/file.py คืนค่าไฟล์เดียวจากจุดคืนค่าที่ระบุ
tips.t007: /title "my project" ตั้งชื่อบทสนทนา — กลับมาทำต่อได้ด้วย /resume หรือ hermes -c
tips.t008: /resume ทำต่อจากจุดที่ค้างไว้ในบทสนทนาที่ตั้งชื่อไว้ก่อนหน้า
tips.t009: /queue <prompt> เพิ่มข้อความเข้าคิวรอบถัดไปโดยไม่ขัดจังหวะรอบปัจจุบัน
tips.t010: /undo ลบการโต้ตอบล่าสุดระหว่างผู้ใช้กับผู้ช่วยออกจากบทสนทนา
tips.t011: /retry ส่งข้อความล่าสุดอีกครั้ง — ใช้เมื่อคำตอบของเอเจนต์ยังไม่ตรงความต้องการ
tips.t012: '/verbose วนระดับการแสดงความคืบหน้าเครื่องมือ: off → new → all → verbose'
tips.t013: /reasoning high เพิ่มระดับการคิดของโมเดล และ /reasoning show แสดงเหตุผล
tips.t014: /fast เปิด/ปิดการประมวลผลแบบมีลำดับความสำคัญเพื่อให้ API ตอบเร็วขึ้น (ขึ้นอยู่กับผู้ให้บริการ)
tips.t015: /yolo ข้ามคำขออนุญาตคำสั่งที่มีความเสี่ยงทั้งหมดจนจบบทสนทนา
tips.t016: /model เปลี่ยนโมเดลระหว่างบทสนทนาได้ — ลอง /model sonnet หรือ /model gpt-5
tips.t017: /model --global เปลี่ยนโมเดลเริ่มต้นอย่างถาวร
tips.t018: /personality pirate ตั้งบุคลิกสนุก ๆ — มี 14 แบบในตัว ตั้งแต่ kawaii ถึง shakespeare
tips.t019: /skin เปลี่ยนธีม CLI — ลอง ares, mono, slate, poseidon หรือ charizard
tips.t020: /statusbar เปิด/ปิดแถบสถานะที่แสดงโมเดล โทเคน เปอร์เซ็นต์บริบทที่ใช้ ค่าใช้จ่าย และระยะเวลา
tips.t021: /tools disable browser ปิดเครื่องมือเบราว์เซอร์ชั่วคราวสำหรับบทสนทนาปัจจุบัน
tips.t022: /browser connect เชื่อมเครื่องมือเบราว์เซอร์กับเบราว์เซอร์ตระกูล Chromium ที่เปิดอยู่ผ่าน CDP
tips.t023: /plugins แสดงปลั๊กอินที่ติดตั้งและสถานะ
tips.t024: /cron จัดการงานตามกำหนดเวลา — ตั้งพรอมป์ต์ที่ทำซ้ำและส่งผลลัพธ์ไปยังแพลตฟอร์มต่าง ๆ ได้
tips.t025: /reload-mcp โหลดการตั้งค่าเซิร์ฟเวอร์ MCP ใหม่โดยไม่ต้องเริ่มโปรแกรมใหม่
tips.t026: /usage แสดงการใช้โทเคน รายละเอียดค่าใช้จ่าย และระยะเวลาบทสนทนา
tips.t027: /insights แสดงการวิเคราะห์การใช้งานย้อนหลัง 30 วัน
tips.t028: /paste ตรวจหาภาพในคลิปบอร์ดและแนบกับข้อความถัดไป
tips.t029: /profile แสดงโปรไฟล์ที่ใช้งานและไดเรกทอรีหลักของโปรไฟล์
tips.t030: /config แสดงภาพรวมการตั้งค่าปัจจุบัน
tips.t031: /stop หยุดกระบวนการเบื้องหลังทั้งหมดที่เอเจนต์เริ่มไว้
tips.t032: '@file:path/to/file.py แทรกเนื้อหาไฟล์ในข้อความโดยตรง'
tips.t033: '@file:main.py:10-50 แทรกเฉพาะบรรทัด 10-50 ของไฟล์'
tips.t034: '@folder:src/ แทรกรายการโครงสร้างไดเรกทอรี'
tips.t035: '@diff แทรกการเปลี่ยนแปลง Git ที่ยังไม่อยู่ใน staging ลงในข้อความ'
tips.t036: '@staged แทรกการเปลี่ยนแปลง Git ที่อยู่ใน staging (git diff --staged)'
tips.t037: '@git:5 แทรก 5 คอมมิตล่าสุดพร้อมแพตช์เต็ม'
tips.t038: '@url:https://example.com ดึงและแทรกเนื้อหาหน้าเว็บ'
tips.t039: พิมพ์ @ เพื่อเติมพาธระบบไฟล์อัตโนมัติ — เลือกไฟล์ได้แบบโต้ตอบ
tips.t040: 'รวมการอ้างอิงหลายรายการได้: "ตรวจ @file:main.py และ @file:test.py ว่าสอดคล้องกันหรือไม่"'
tips.t041: Alt+Enter ขึ้นบรรทัดใหม่เพื่อพิมพ์หลายบรรทัด (Windows Terminal ดัก Alt+Enter ไว้ — ใช้ Ctrl+Enter แทน)
tips.t042: Ctrl+C ขัดจังหวะเอเจนต์ กดสองครั้งภายใน 2 วินาทีเพื่อบังคับออก
tips.t043: Ctrl+Z พัก Hermes ไว้เบื้องหลัง — เรียก fg ในเชลล์เพื่อทำต่อ
tips.t044: Tab ยอมรับข้อความแนะนำที่จางอยู่ หรือเติมคำสั่งสแลชอัตโนมัติ
tips.t045: พิมพ์ข้อความใหม่ขณะเอเจนต์ทำงานเพื่อขัดจังหวะและเปลี่ยนแนวทาง
tips.t046: Alt+V วางภาพจากคลิปบอร์ดลงในบทสนทนา
tips.t047: วางข้อความตั้งแต่ 5 บรรทัดขึ้นไปเพื่อบันทึกเป็นไฟล์อัตโนมัติ และแทรกการอ้างอิงแบบย่อ
tips.t048: hermes -c ทำบทสนทนา CLI ล่าสุดต่อ และ hermes -c "project name" ทำต่อจากชื่อบทสนทนา
tips.t049: hermes -w สร้าง Git worktree แยก — เหมาะสำหรับให้หลายเอเจนต์ทำงานคู่ขนาน
tips.t050: 'hermes -w -q "Fix issue #42" รวมการแยก worktree กับคำขอครั้งเดียว'
tips.t051: hermes chat -t web,terminal เปิดเฉพาะชุดเครื่องมือที่ระบุเพื่อให้บทสนทนาเน้นงาน
tips.t052: hermes chat -s github-pr-workflow โหลดทักษะล่วงหน้าเมื่อเริ่ม
tips.t053: hermes chat -q "query" ประมวลผลคำขอเดียวแบบไม่โต้ตอบแล้วออก
tips.t054: hermes chat --max-turns 1000 เปลี่ยนขีดจำกัดเริ่มต้นจาก 500 ขั้นตอนต่อรอบ
tips.t055: hermes chat --checkpoints เปิดการบันทึกภาพระบบไฟล์ก่อนการเปลี่ยนไฟล์ที่อาจทำลายข้อมูลทุกครั้ง
tips.t056: hermes --yolo ข้ามคำขออนุญาตคำสั่งที่มีความเสี่ยงทั้งหมดตลอดบทสนทนา
tips.t057: hermes chat --source telegram ติดป้ายบทสนทนาเพื่อกรองด้วย hermes sessions list
tips.t058: hermes -p work chat ทำงานด้วยโปรไฟล์ที่ระบุโดยไม่เปลี่ยนโปรไฟล์เริ่มต้น
tips.t059: hermes doctor --fix วินิจฉัยและซ่อมปัญหาการตั้งค่ากับ dependencies อัตโนมัติ
tips.t060: hermes dump แสดงสรุปการติดตั้งแบบย่อ — เหมาะสำหรับรายงานบั๊ก
tips.t061: hermes config set KEY VALUE ส่งค่าลับไป .env และค่าอื่นไป config.yaml โดยอัตโนมัติ
tips.t062: hermes config edit เปิด config.yaml ในโปรแกรมแก้ไขเริ่มต้น
tips.t063: hermes config check ตรวจหาตัวเลือกการตั้งค่าที่ขาดหรือล้าสมัย
tips.t064: hermes sessions browse เปิดตัวเลือกบทสนทนาแบบโต้ตอบพร้อมการค้นหา
tips.t065: hermes sessions stats แสดงจำนวนบทสนทนาตามแพลตฟอร์มและขนาดฐานข้อมูล
tips.t066: hermes sessions prune --older-than 30 ล้างบทสนทนาเก่า
tips.t067: hermes skills search react --source skills-sh ค้นหาในคลังสาธารณะ skills.sh
tips.t068: hermes skills check ตรวจทักษะที่ติดตั้งจากฮับว่ามีอัปเดตต้นทางหรือไม่
tips.t069: hermes skills tap add myorg/skills-repo เพิ่มแหล่งทักษะ GitHub ที่กำหนดเอง
tips.t070: hermes skills snapshot export setup.json ส่งออกการตั้งค่าทักษะเพื่อสำรองหรือแชร์
tips.t071: hermes mcp add github --command npx เพิ่มเซิร์ฟเวอร์ MCP จากบรรทัดคำสั่ง
tips.t072: hermes mcp-serve เรียก Hermes เป็นเซิร์ฟเวอร์ MCP ให้เอเจนต์อื่นใช้
tips.t073: hermes auth add เพิ่ม API key หลายรายการเพื่อหมุนเวียนข้อมูลรับรอง
tips.t074: hermes completion bash >> ~/.bashrc เปิดการเติมคำสั่งและโปรไฟล์ทั้งหมดด้วย Tab
tips.t075: hermes logs -f ติดตาม agent.log แบบเรียลไทม์ ใช้ --level WARNING --since 1h เพื่อกรองผลลัพธ์
tips.t076: hermes backup สร้างไฟล์ ZIP สำรองไดเรกทอรีหลัก Hermes ทั้งหมด
tips.t077: hermes profile create coder สร้างโปรไฟล์แยกที่ใช้เป็นคำสั่งของตัวเองได้
tips.t078: hermes profile create work --clone คัดลอกการตั้งค่าและคีย์ปัจจุบันไปยังโปรไฟล์ใหม่
tips.t079: hermes update ซิงก์ทักษะใหม่ที่มาพร้อมโปรแกรมให้ทุกโปรไฟล์โดยอัตโนมัติ
tips.t080: hermes gateway install ตั้งค่า Hermes ให้เป็นบริการระบบ (systemd/launchd)
tips.t081: hermes memory setup ตั้งค่าผู้ให้บริการความจำภายนอก (Honcho, Mem0 ฯลฯ)
tips.t082: hermes webhook subscribe สร้างเส้นทาง webhook ตามเหตุการณ์พร้อมตรวจสอบ HMAC
tips.t083: 'ลดค่าใช้จ่าย: hermes tools ปิดเครื่องมือที่ไม่ใช้ และ hermes skills config ลดทักษะที่เปิดใช้'
tips.t084: /reasoning low หรือ /reasoning minimal ลดระดับการคิดต่ำกว่าค่าเริ่มต้น (medium) — ตอบเร็วขึ้นและประหยัดขึ้น
tips.t085: hermes models ส่งงานภาพ การบีบอัด และงานเสริมไปยังโมเดลที่ประหยัดกว่า — ลดค่าโทเคนเบื้องหลังได้กว่า 85%
  โดยไม่ลดระดับโมเดลแชทหลัก
tips.t086: 'ตั้ง display.bell_on_complete: true ใน config.yaml เพื่อให้มีเสียงเมื่อจบงานที่ใช้เวลานาน'
tips.t087: 'ตั้ง display.streaming: true เพื่อเห็นโทเคนปรากฏแบบเรียลไทม์ขณะโมเดลสร้างคำตอบ'
tips.t088: 'ตั้ง display.show_reasoning: true เพื่อดูเหตุผลที่โมเดลแสดง'
tips.t089: 'ตั้ง display.compact: true เพื่อลดช่องว่างและแสดงข้อมูลได้แน่นขึ้น'
tips.t090: 'ตั้ง display.busy_input_mode: queue เพื่อเข้าคิวข้อความแทนการขัดจังหวะเอเจนต์ หรือ steer เพื่อแทรกระหว่างทำงานผ่าน
  /steer'
tips.t091: 'ตั้ง display.resume_display: minimal เพื่อข้ามการแสดงบทสนทนาเต็มเมื่อกลับมาทำต่อ'
tips.t092: 'ตั้ง compression.threshold: 0.50 เพื่อควบคุมเวลาที่บีบอัดอัตโนมัติ (ค่าเริ่มต้น: 50% ของบริบท)'
tips.t093: 'ตั้ง agent.max_turns: 1000 เพื่อให้เอเจนต์เรียกเครื่องมือได้หลายขั้นตอนขึ้นต่อรอบ'
tips.t094: 'ตั้ง file_read_max_chars: 200000 เพื่อเพิ่มเนื้อหาสูงสุดต่อการเรียก read_file'
tips.t095: 'ตั้ง approvals.mode: smart เพื่อให้ LLM อนุญาตคำสั่งที่ปลอดภัยและปฏิเสธคำสั่งที่มีความเสี่ยงโดยอัตโนมัติ'
tips.t096: ตั้ง fallback_model ใน config.yaml เพื่อสลับไปยังผู้ให้บริการสำรองโดยอัตโนมัติเมื่อเกิดปัญหา
tips.t097: 'ตั้ง privacy.redact_pii: true เพื่อแฮชรหัสผู้ใช้และหมายเลขโทรศัพท์ก่อนส่งให้ LLM'
tips.t098: 'ตั้ง browser.headed: true เพื่อดูหน้าต่าง Chromium ในเครื่องขณะเอเจนต์ท่องเว็บ'
tips.t099: 'ตั้ง worktree: true ใน config.yaml เพื่อสร้าง Git worktree ทุกครั้ง (เหมือน hermes -w)'
tips.t100: 'ตั้ง security.website_blocklist.enabled: true เพื่อบล็อกโดเมนที่ระบุจากเครื่องมือเว็บ'
tips.t101: 'ตั้ง cron.wrap_response: false เพื่อส่งผลลัพธ์เอเจนต์โดยตรงโดยไม่มีส่วนหัว/ท้ายของ cron'
tips.t102: HERMES_TIMEZONE กำหนดเขตเวลาแทนเขตเวลาของเซิร์ฟเวอร์โดยใช้ชื่อเขตเวลา IANA
tips.t103: config.yaml รองรับการแทนค่าตัวแปรสภาพแวดล้อมด้วยรูปแบบ ${VAR_NAME}
tips.t104: คำสั่งด่วนใน config.yaml เรียกคำสั่งเชลล์ทันทีโดยไม่ใช้โทเคน
tips.t105: กำหนดบุคลิกเองได้ใน config.yaml ที่ agent.personalities
tips.t106: provider_routing ควบคุมการจัดลำดับ รายการที่อนุญาต และรายการที่บล็อกผู้ให้บริการ OpenRouter
tips.t107: execute_code เรียกสคริปต์ Python ที่ใช้เครื่องมือ Hermes ผ่านโปรแกรมได้ — ผลลัพธ์ไม่เข้าไปในบริบท
tips.t108: delegate_task สร้างเอเจนต์ย่อยพร้อมกันได้สูงสุด 10 ตัวตามค่าเริ่มต้น (delegation.max_concurrent_children)
  โดยแยกบริบทเพื่อทำงานคู่ขนาน
tips.t109: web_extract ใช้กับ URL ของ PDF ได้ — ส่งลิงก์ PDF เพื่อแปลงเป็น Markdown
tips.t110: search_files ใช้ ripgrep และเร็วกว่า grep — ใช้แทนการเรียก grep ในเทอร์มินัลได้
tips.t111: patch ใช้วิธีจับคู่โดยประมาณ 9 แบบ ความต่างเล็กน้อยของช่องว่างจึงไม่ทำให้การแก้ไขล้มเหลว
tips.t112: patch รองรับรูปแบบ V4A เพื่อแก้ไขหลายไฟล์จำนวนมากในการเรียกครั้งเดียว
tips.t113: read_file แนะนำชื่อไฟล์ใกล้เคียงเมื่อไม่พบไฟล์
tips.t114: read_file ลดข้อมูลซ้ำอัตโนมัติ — อ่านไฟล์ที่ไม่เปลี่ยนซ้ำจะได้ข้อความย่อแทนเนื้อหาเต็ม
tips.t115: ตั้ง browser.user_data_dir เป็นโฟลเดอร์เพื่อเก็บโปรไฟล์ Chromium ถาวร และคงการเข้าสู่ระบบเว็บไซต์ข้ามบทสนทนา
tips.t116: browser.chromium_args เพิ่มแฟล็ก Chromium สำหรับเบราว์เซอร์ในเครื่อง เช่น --lang=de
tips.t117: image_generate สร้างภาพด้วย FLUX 2 Pro และเพิ่มความละเอียด 2 เท่าอัตโนมัติ
tips.t118: text_to_speech แปลงข้อความเป็นเสียง — เล่นเป็นข้อความเสียงใน Telegram
tips.t119: send_message ติดต่อแพลตฟอร์มข้อความที่เชื่อมต่อไว้ได้จากภายในบทสนทนา
tips.t120: เครื่องมือ todo ช่วยให้เอเจนต์ติดตามงานซับซ้อนที่มีหลายขั้นตอนระหว่างบทสนทนา
tips.t121: session_search ค้นหาเนื้อหาเต็มจากบทสนทนาที่ผ่านมาทั้งหมด
tips.t122: เอเจนต์บันทึกความชอบ คำแก้ไข และข้อมูลสภาพแวดล้อมลงความจำอัตโนมัติ
tips.t123: /moa ส่งพรอมป์ต์ยากหนึ่งรายการผ่านชุดโมเดล Mixture of Agents ที่คุณตั้งค่าไว้
tips.t124: คำสั่งเทอร์มินัลรองรับโหมดเบื้องหลังพร้อม notify_on_complete สำหรับงานที่ใช้เวลานาน
tips.t125: กระบวนการเทอร์มินัลเบื้องหลังรองรับ watch_patterns เพื่อแจ้งเตือนเมื่อพบผลลัพธ์บรรทัดที่ระบุ
tips.t126: 'เครื่องมือเทอร์มินัลรองรับ 6 ระบบเบื้องหลัง: local, Docker, SSH, Modal, Daytona และ Singularity'
tips.t127: แต่ละโปรไฟล์มีการตั้งค่า API key ความจำ บทสนทนา ทักษะ และงาน cron ของตัวเอง
tips.t128: ชื่อโปรไฟล์กลายเป็นคำสั่งเชลล์ — 'hermes profile create coder' สร้างคำสั่ง 'coder'
tips.t129: hermes profile export coder -o backup.tar.gz สร้างแฟ้มโปรไฟล์ที่ย้ายไปใช้ที่อื่นได้
tips.t130: หากสองโปรไฟล์ใช้โทเคนบอตเดียวกันโดยไม่ตั้งใจ เกตเวย์ตัวที่สองจะถูกบล็อกพร้อมข้อผิดพลาดที่ชัดเจน
tips.t131: บทสนทนาสร้างชื่อที่สื่อความหมายอัตโนมัติหลังการโต้ตอบครั้งแรก — ไม่จำเป็นต้องตั้งชื่อเอง
tips.t132: 'ชื่อบทสนทนารองรับลำดับต่อเนื่อง: "my project" → "my project #2" → "my project #3"'
tips.t133: เมื่อออก Hermes จะแสดงคำสั่งสำหรับทำต่อพร้อมรหัสบทสนทนาและสถิติ
tips.t134: hermes sessions export backup.jsonl ส่งออกบทสนทนาทั้งหมดเพื่อสำรองหรือวิเคราะห์
tips.t135: hermes -r SESSION_ID ทำบทสนทนาที่ผ่านมาเฉพาะรายการต่อโดยใช้รหัส
tips.t136: ความจำเป็นภาพข้อมูลคงที่ — การเปลี่ยนแปลงจะปรากฏในพรอมป์ต์ระบบเมื่อเริ่มบทสนทนาถัดไปเท่านั้น
tips.t137: รายการความจำถูกตรวจรูปแบบการแทรกคำสั่งและการลักลอบส่งข้อมูลโดยอัตโนมัติ
tips.t138: 'เอเจนต์มีที่เก็บความจำสองส่วน: บันทึกส่วนตัว (ประมาณ 2,200 ตัวอักษร) และโปรไฟล์ผู้ใช้ (ประมาณ 1,375 ตัวอักษร)'
tips.t139: คำแก้ไขที่คุณบอกเอเจนต์ ("ไม่ใช่ ให้ทำแบบนี้") มักถูกบันทึกลงความจำอัตโนมัติ
tips.t140: มีทักษะที่มาพร้อมโปรแกรมกว่า 80 รายการ ครอบคลุม GitHub งานสร้างสรรค์ MLOps งานเพิ่มประสิทธิภาพ การวิจัย
  และอื่น ๆ
tips.t141: ทุกทักษะที่ติดตั้งกลายเป็นคำสั่งสแลชอัตโนมัติ — พิมพ์ / เพื่อดูทั้งหมด
tips.t142: hermes skills install official/security/1password ติดตั้งทักษะเสริมจากที่เก็บโค้ด
tips.t143: ทักษะจำกัดระบบปฏิบัติการได้ — บางรายการโหลดเฉพาะบน macOS หรือ Linux
tips.t144: skills.external_dirs ใน config.yaml ใช้โหลดทักษะจากไดเรกทอรีที่กำหนดเอง
tips.t145: เอเจนต์สร้างทักษะของตัวเองเป็นความจำเชิงขั้นตอนได้ด้วย skill_manage
tips.t146: /plan เขียนแผนดำเนินงานเป็น Markdown ใน .hermes/plans/ โดยยังไม่ลงมือทำ
tips.t147: 'งาน cron แนบทักษะได้: hermes cron add --skill blogwatcher "Check for new posts"'
tips.t148: ปลายทางส่งผล cron ได้แก่ telegram, discord, slack, email, sms และอีกกว่า 12 แพลตฟอร์ม
tips.t149: หากคำตอบ cron เริ่มด้วย [SILENT] จะไม่ส่งผลลัพธ์ — เหมาะกับงานเฝ้าติดตามอย่างเดียว
tips.t150: cron รองรับเวลาหน่วง (30m) ช่วงเวลาซ้ำ (every 2h) นิพจน์ cron และเวลาแบบ ISO
tips.t151: งาน cron ทำงานในบทสนทนาเอเจนต์ใหม่ทั้งหมด — พรอมป์ต์ต้องมีข้อมูลครบในตัว
tips.t152: ใช้โหมดเสียงโดยไม่ต้องมี API key ได้เมื่อติดตั้ง faster-whisper (แปลงเสียงเป็นข้อความในเครื่องฟรี)
tips.t153: 'มีผู้ให้บริการ TTS ห้าราย: Edge TTS (ฟรี), ElevenLabs, OpenAI, NeuTTS (ฟรีในเครื่อง) และ MiniMax'
tips.t154: /voice on เปิดโหมดเสียงใน CLI ใช้ Ctrl+B เริ่ม/หยุดการบันทึกแบบกดพูด
tips.t155: TTS แบบสตรีมเล่นทีละประโยคเมื่อสร้างเสร็จ — ไม่ต้องรอคำตอบครบ
tips.t156: ข้อความเสียงบน Telegram, Discord, WhatsApp และ Slack ถูกถอดเสียงอัตโนมัติ
tips.t157: 'Hermes ใช้งานบนแพลตฟอร์มข้อความ 21 แห่ง: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams,
  อีเมล และอื่น ๆ'
tips.t158: hermes gateway install ตั้งค่าเป็นบริการระบบที่เริ่มเมื่อเปิดเครื่อง
tips.t159: DingTalk ใช้ Stream Mode — ไม่ต้องมี webhook หรือ URL สาธารณะ
tips.t160: BlueBubbles เชื่อม iMessage กับ Hermes ผ่านเซิร์ฟเวอร์ macOS ในเครื่อง
tips.t161: เส้นทาง webhook รองรับการตรวจสอบ HMAC การจำกัดอัตรา และการกรองเหตุการณ์
tips.t162: เซิร์ฟเวอร์ API มีปลายทางที่เข้ากันได้กับ OpenAI และใช้งานกับ Open WebUI กับ LibreChat ได้
tips.t163: 'โหมดช่องเสียง Discord: บอตเข้าร่วมช่องเสียง ถอดเสียงพูด และตอบด้วยเสียง'
tips.t164: 'group_sessions_per_user: true ให้แต่ละคนมีบทสนทนาของตัวเองในแชทกลุ่ม'
tips.t165: /sethome กำหนดแชทเป็นช่องหลักสำหรับรับผลจากงาน cron
tips.t166: เกตเวย์รองรับการหมดเวลาเมื่อไม่มีการใช้งาน — เอเจนต์ที่ยังทำงานสามารถทำต่อได้ไม่จำกัดเวลา
tips.t167: 'การอนุญาตคำสั่งที่มีความเสี่ยงมี 4 ระดับ: ครั้งนี้ บทสนทนานี้ เสมอ (รายการอนุญาตถาวร) และไม่อนุญาต'
tips.t168: โหมดอนุญาตอัจฉริยะใช้ LLM เพื่ออนุญาตคำสั่งที่ปลอดภัยอัตโนมัติ และแจ้งคำสั่งที่มีความเสี่ยง
tips.t169: การป้องกัน SSRF บล็อกเครือข่ายส่วนตัว loopback, link-local และที่อยู่ข้อมูลเมตาของคลาวด์
tips.t170: นำหน้ารหัสบทสนทนาด้วยเวลา (20250305_091523_abcd) เพื่อเรียงลำดับได้ตามธรรมชาติใน ls และ jq
tips.t171: กระบวนการย่อย MCP ได้รับสภาพแวดล้อมที่กรองแล้ว — ส่งผ่านเฉพาะตัวแปรระบบที่ปลอดภัย
tips.t172: ไฟล์บริบท (.hermes.md, AGENTS.md) ถูกตรวจการแทรกคำสั่งก่อนโหลด
tips.t173: command_allowlist ใน config.yaml อนุญาตรูปแบบคำสั่งเชลล์ที่ระบุอย่างถาวร
tips.t174: บริบทบีบอัดอัตโนมัติเมื่อถึงเกณฑ์ — บันทึกความจำและสรุปประวัติ
tips.t175: แถบสถานะเปลี่ยนเป็นสีเหลือง ส้ม แล้วแดง เมื่อบริบทใกล้เต็ม
tips.t176: SOUL.md เป็นไฟล์ตัวตนหลักของเอเจนต์ — ปรับแต่งเพื่อกำหนดพฤติกรรม
tips.t177: Hermes โหลดบริบทโปรเจกต์จาก .hermes.md, AGENTS.md, CLAUDE.md หรือ .cursorrules (ไฟล์แรกที่พบ)
tips.t178: ค้นพบไฟล์ AGENTS.md ในไดเรกทอรีย่อยตามลำดับเมื่อเอเจนต์เข้าไปในโฟลเดอร์
tips.t179: ไฟล์บริบทจำกัดที่ 20,000 ตัวอักษร โดยตัดอย่างเหมาะสมและเก็บส่วนต้น/ท้าย
tips.t180: 'ระบบเบราว์เซอร์: Chromium ในเครื่อง, Lightpanda, Browserbase, Browser Use และ Firecrawl — รวมถึง Camofox ในรูปแบบปลั๊กอิน'
tips.t181: 'Camofox (Firefox ที่ช่วยหลีกเลี่ยงการตรวจจับ) เป็นปลั๊กอินแล้ว: hermes plugins install camofox'
tips.t182: browser_exec ทำหลายขั้นตอนเบราว์เซอร์ในการเรียก Python ครั้งเดียว — เปิดหน้า ดึงข้อมูล และคลิกพร้อมกันได้
tips.t183: 'browser.dialog_policy กำหนดการจัดการกล่องโต้ตอบของหน้าเว็บ: must_respond (เอเจนต์ตอบด้วย browser_dialog), auto_dismiss
  หรือ auto_accept'
tips.t184: hermes mcp เปิดตัวเลือก MCP ที่ Nous รับรองแบบโต้ตอบ ติดตั้งได้ด้วยการกดปุ่มเดียว
tips.t185: hermes mcp catalog แสดงเซิร์ฟเวอร์ MCP ที่ Nous รับรองและมาพร้อมที่เก็บโค้ด
tips.t186: hermes mcp install <name> ติดตั้งรายการจากแค็ตตาล็อก ขอข้อมูลรับรอง และให้เลือกเครื่องมือที่จะเปิดใช้
tips.t187: ตั้งค่าเซิร์ฟเวอร์ MCP ใน config.yaml — รองรับทั้งการรับส่งแบบ stdio และ HTTP
tips.t188: 'กรองเครื่องมือรายเซิร์ฟเวอร์: tools.include ระบุรายการอนุญาต และ tools.exclude ระบุรายการที่ไม่ใช้'
tips.t189: เซิร์ฟเวอร์ MCP สร้างชุดเครื่องมืออัตโนมัติขณะทำงาน — hermes tools เปิด/ปิดแยกตามแพลตฟอร์มได้
tips.t190: 'การรองรับ MCP OAuth: auth: oauth เปิดการให้สิทธิ์ผ่านเบราว์เซอร์พร้อม PKCE'
tips.t191: จุดคืนค่าไม่เพิ่มภาระเมื่อไม่มีการแก้ไขไฟล์ — เปิดใช้ตามค่าเริ่มต้น
tips.t192: บันทึกภาพสถานะก่อนย้อนคืนอัตโนมัติ เพื่อให้ย้อนกลับจากการย้อนคืนได้
tips.t193: /rollback ย้อนรอบบทสนทนาด้วย เอเจนต์จึงไม่จดจำการเปลี่ยนแปลงที่ย้อนคืนแล้ว
tips.t194: จุดคืนค่าใช้ที่เก็บเงาในโฟลเดอร์ checkpoints ของ Hermes — ไม่แตะ .git ของโปรเจกต์
tips.t195: batch_runner.py ประมวลผลพรอมป์ต์หลายร้อยรายการพร้อมกันเพื่อสร้างข้อมูลฝึก
tips.t196: hermes chat -Q เปิดโหมดเงียบสำหรับการใช้ผ่านโปรแกรม — ซ่อนแบนเนอร์และตัวบอกสถานะหมุน
tips.t197: การบันทึกลำดับการทำงาน (--save-trajectories) เก็บการใช้เครื่องมือครบถ้วนเพื่อฝึกโมเดล
tips.t198: 'ปลั๊กอินมีสามประเภท: ทั่วไป (เครื่องมือ/ฮุก) ผู้ให้บริการความจำ และกลไกบริบท'
tips.t199: hermes plugins install owner/repo ติดตั้งปลั๊กอินจาก GitHub โดยตรง
tips.t200: 'ผู้ให้บริการความจำภายนอก: Honcho, Hindsight, Mem0, OpenViking และอื่น ๆ ผ่าน hermes plugins install'
tips.t201: ฮุกของปลั๊กอินมี pre/post_tool_call, pre/post_llm_call และ transform_terminal_output
  เพื่อปรับผลลัพธ์เป็นรูปแบบมาตรฐาน
tips.t202: แคชพรอมป์ต์ (Anthropic) ลดค่าใช้จ่ายด้วยการใช้ส่วนต้นของพรอมป์ต์ระบบที่แคชไว้ซ้ำ
tips.t203: เอเจนต์สร้างชื่อบทสนทนาอัตโนมัติในเธรดเบื้องหลัง — ไม่เพิ่มเวลารอ
tips.t204: การเลือกโมเดลอัจฉริยะส่งคำขอที่ง่ายไปยังโมเดลที่ประหยัดกว่าได้อัตโนมัติ
tips.t205: 'คำสั่งสแลชรองรับการจับคู่คำนำหน้า: /h ใช้เป็น /help และ /mod เป็น /model'
tips.t206: ลากพาธไฟล์ลงเทอร์มินัลเพื่อแนบภาพอัตโนมัติหรือส่งเป็นบริบท
tips.t207: .worktreeinclude ที่รากของที่เก็บโค้ดระบุไฟล์ที่ Git ละเว้นแต่ต้องคัดลอกไป worktree
tips.t208: hermes acp เรียก Hermes เป็นเซิร์ฟเวอร์ ACP เพื่อเชื่อมต่อ VS Code, Zed และ JetBrains
tips.t209: 'ผู้ให้บริการที่กำหนดเอง: บันทึกปลายทางพร้อมชื่อใน config.yaml ใต้ custom_providers'
tips.t210: HERMES_EPHEMERAL_SYSTEM_PROMPT แทรกพรอมป์ต์ระบบที่ไม่ถูกบันทึกลงประวัติ
tips.t211: credential_pool_strategies รองรับการหมุนเวียนแบบ fill_first, round_robin, least_used และ random
tips.t212: hermes auth add nous หรือ hermes auth add openai-codex ตั้งค่าผู้ให้บริการที่ใช้ OAuth
tips.t213: เซิร์ฟเวอร์ API รองรับทั้ง Chat Completions และ Responses API พร้อมเก็บสถานะฝั่งเซิร์ฟเวอร์
tips.t214: 'tool_preview_length: 0 ในการตั้งค่าแสดงพาธไฟล์เต็มในรายการกิจกรรมของตัวบอกสถานะหมุน'
tips.t215: hermes status --deep ตรวจวินิจฉัยทุกองค์ประกอบอย่างละเอียดขึ้น
tips.t216: งาน cron แนบสคริปต์ Python (--script) ได้ โดยแทรก stdout ของสคริปต์เป็นบริบทในพรอมป์ต์
tips.t217: สคริปต์ cron อยู่ในโฟลเดอร์ scripts ของ Hermes และทำงานก่อนเอเจนต์ — เหมาะสำหรับกระบวนการรวบรวมข้อมูล
tips.t218: prefill_messages_file ใน config.yaml แทรกตัวอย่าง few-shot ในทุกการเรียก API โดยไม่บันทึกลงประวัติ
tips.t219: SOUL.md แทนที่ตัวตนเริ่มต้นของเอเจนต์ทั้งหมด — เขียนใหม่เพื่อให้ Hermes เป็นแบบที่คุณต้องการ
tips.t220: SOUL.md ถูกสร้างพร้อมบุคลิกเริ่มต้นเมื่อใช้งานครั้งแรก แก้ไขเพื่อปรับแต่งได้
tips.t221: /compress <focus topic> จัดสรรงบสรุป 60-70% ให้หัวข้อของคุณ และตัดส่วนที่เหลืออย่างมาก
tips.t222: ตั้งแต่การบีบอัดครั้งที่สอง ตัวบีบอัดจะอัปเดตสรุปเดิมแทนการเริ่มใหม่
tips.t223: ก่อนรีเซ็ตบทสนทนาเกตเวย์ Hermes จะบันทึกข้อมูลสำคัญลงความจำอัตโนมัติในเบื้องหลัง
tips.t224: 'network.force_ipv4: true ใน config.yaml แก้อาการค้างบนเซิร์ฟเวอร์ที่ IPv6 มีปัญหา โดยปรับ socket ขณะทำงาน'
tips.t225: "เครื่องมือเทอร์มินัลอธิบายรหัสออกที่พบบ่อย: grep คืน 1 = 'ไม่พบรายการที่ตรงกัน (ไม่ใช่ข้อผิดพลาด)'"
tips.t226: คำสั่งเทอร์มินัลเบื้องหน้าที่ล้มเหลวลองซ้ำอัตโนมัติสูงสุด 3 ครั้ง โดยเพิ่มเวลารอแบบทวีคูณ (2, 4, 8 วินาที)
tips.t227: คำสั่ง sudo ที่ไม่มีตัวเลือกถูกปรับให้ส่ง SUDO_PASSWORD จาก .env ผ่านไปป์อัตโนมัติ — ไม่ต้องกรอกแบบโต้ตอบ
tips.t228: 'ตัวช่วยของ execute_code ต้องนำเข้าอย่างชัดเจน: from hermes_tools import json_parse, shell_quote, retry'
tips.t229: เครื่องมือแซนด์บ็อกซ์ 7 รายการของ execute_code (web_search, terminal, read/write/search/patch) ใช้ RPC —
  ไม่เข้าไปในบริบท
tips.t230: การอ่านส่วนเดิมของไฟล์ตั้งแต่ 3 ครั้งจะมีคำเตือน และตั้งแต่ 4 ครั้งจะถูกบล็อกเพื่อป้องกันการวนซ้ำ
tips.t231: write_file และ patch ตรวจว่าไฟล์ถูกแก้จากภายนอกหลังอ่านครั้งล่าสุดหรือไม่ และเตือนเมื่อข้อมูลล้าสมัย
tips.t232: รูปแบบแพตช์ V4A รองรับคำสั่ง Add File, Delete File และ Move File นอกเหนือจาก Update
tips.t233: เซิร์ฟเวอร์ MCP ขอให้ LLM สร้างคำตอบกลับผ่าน sampling ได้ — เอเจนต์กลายเป็นเครื่องมือให้เซิร์ฟเวอร์
tips.t234: เซิร์ฟเวอร์ MCP ส่ง notifications/tools/list_changed
  เพื่อให้ลงทะเบียนเครื่องมือใหม่อัตโนมัติโดยไม่เริ่มโปรแกรมใหม่
tips.t235: "delegate_task พร้อม acp_command: 'claude' เริ่ม Claude Code เป็นเอเจนต์ลูกจากแพลตฟอร์มใดก็ได้"
tips.t236: การมอบหมายมีเธรดสัญญาณสถานะ — กิจกรรมของเอเจนต์ลูกส่งถึงเอเจนต์หลักเพื่อป้องกันเกตเวย์หมดเวลา
tips.t237: เมื่อผู้ให้บริการคืน HTTP 402 (ต้องชำระเงิน) ไคลเอนต์งานเสริมจะเปลี่ยนไปใช้รายถัดไปอัตโนมัติ
tips.t238: agent.tool_use_enforcement ชี้นำโมเดลที่อธิบายการกระทำแทนการเรียกเครื่องมือ — ใช้อัตโนมัติสำหรับ GPT/Codex
tips.t239: agent.restart_after_turn_timeout ให้รอบที่กำลังทำงานเสร็จก่อน /restart เข้า stop(); restart_drain_timeout
  คือเวลารอก่อนบังคับขัดจังหวะเมื่อเริ่ม stop() แล้วเท่านั้น
tips.t240: agent.api_max_retries (ค่าเริ่มต้น 3) ควบคุมจำนวนครั้งที่ลองเรียก API ซ้ำก่อนแสดงข้อผิดพลาด —
  ลดค่าเพื่อสลับระบบสำรองเร็วขึ้น
tips.t241: เกตเวย์แคชอินสแตนซ์ AIAgent แยกตามบทสนทนา — การทำลายแคชนี้ทำให้แคชพรอมป์ต์ Anthropic ใช้ต่อไม่ได้
tips.t242: เว็บไซต์ใดก็เปิดเผยทักษะผ่าน /.well-known/skills/index.json ได้ — ฮับทักษะค้นพบอัตโนมัติ
tips.t243: บันทึกตรวจสอบทักษะที่ skills/.hub/audit.log ในไดเรกทอรีหลัก Hermes ติดตามการติดตั้งและลบทุกครั้ง
tips.t244: 'Git worktree ที่ค้างถูกล้างอัตโนมัติ: ลบต้นไม้ที่สะอาดและรวมแล้ว; ต้นไม้ที่ว่างงานแต่มีการแก้ไขหรือยังไม่ push
  จะถูกเก็บถาวรก่อน และคืนได้ด้วย hermes worktree restore'
tips.t245: โปรไฟล์แยกสถานะ Hermes ผ่าน HERMES_HOME; กระบวนการย่อยเครื่องมือบนโฮสต์ยังใช้ HOME จริง เว้นแต่
  terminal.home_mode เป็น profile
tips.t246: ตัวแปร HERMES_HOME_MODE (เลขฐานแปด เช่น 0701) กำหนดสิทธิ์ไดเรกทอรีเองเพื่อให้เว็บเซิร์ฟเวอร์เข้าถึงได้
tips.t247: 'โหมดคอนเทนเนอร์: วาง .container-mode ใน HERMES_HOME แล้ว CLI บนโฮสต์จะเข้าไปทำงานในคอนเทนเนอร์อัตโนมัติ'
tips.t248: 'Ctrl+C มีลำดับความสำคัญ 5 ระดับ: ยกเลิกการบันทึก → ยกเลิกคำถาม → ยกเลิกตัวเลือก → ขัดจังหวะเอเจนต์ → ออก'
tips.t249: ทุกการขัดจังหวะขณะเอเจนต์ทำงานถูกบันทึกพร้อมเวลาใน interrupt_debug.log ของไดเรกทอรีหลัก Hermes
tips.t250: BROWSER_CDP_URL เชื่อมเครื่องมือเบราว์เซอร์กับเบราว์เซอร์ตระกูล Chromium ที่เปิดอยู่ — รับ WebSocket, HTTP
  หรือ host:port
tips.t251: BROWSERBASE_ADVANCED_STEALTH=true เปิดการหลีกเลี่ยงการตรวจจับขั้นสูงด้วย Chromium ที่ปรับแต่ง (แผน Scale)
tips.t252: CLI เปลี่ยนเป็นโหมดกะทัดรัดอัตโนมัติเมื่อเทอร์มินัลแคบกว่า 80 คอลัมน์
tips.t253: 'คำสั่งด่วนรองรับสองประเภท: exec (เรียกคำสั่งเชลล์โดยตรง) และ alias (ส่งต่อไปคำสั่งอื่น)'
tips.t254: 'โมเดลสำหรับงานที่มอบหมาย: delegation.model และ delegation.provider ในการตั้งค่าส่งเอเจนต์ย่อยไปใช้โมเดลที่ประหยัดกว่า'
tips.t255: delegation.reasoning_effort ควบคุมระดับการคิดของเอเจนต์ย่อยแยกจากเอเจนต์หลัก
tips.t256: 'display.platforms ใน config.yaml กำหนดการแสดงผลแยกตามแพลตฟอร์มได้: {telegram: {tool_progress: all}}'
tips.t257: human_delay.mode ในการตั้งค่าจำลองความเร็วพิมพ์ของมนุษย์ — กำหนดช่วง min_ms/max_ms ได้
tips.t258: การย้ายรุ่นการตั้งค่าทำอัตโนมัติเมื่อโหลด — คีย์ใหม่ปรากฏโดยไม่ต้องเพิ่มเอง
tips.t259: โมเดล GPT และ Codex ได้รับแนวทางพิเศษในพรอมป์ต์ระบบเกี่ยวกับวินัยและข้อบังคับการใช้เครื่องมือ
tips.t260: โมเดล Gemini ได้รับคำแนะนำเฉพาะเรื่องพาธสัมบูรณ์ การเรียกเครื่องมือคู่ขนาน และคำสั่งที่ไม่โต้ตอบ
tips.t261: ตั้ง context.engine ใน config.yaml เป็นชื่อปลั๊กอินเพื่อเลือกวิธีจัดการบริบทอื่นได้
tips.t262: เมื่อใช้เบราว์เซอร์คลาวด์ URL ของ localhost และ LAN จะเปิดใน Chromium ในเครื่องแทน
  (browser.auto_local_for_private_urls เปิดตามค่าเริ่มต้น)
tips.t263: 'ตัวบีบอัดมีขั้นเตรียมที่ประหยัด: แทนผลลัพธ์เครื่องมือที่ยาวกว่า 200 ตัวอักษรด้วยตัวแทนก่อนเรียก LLM'
tips.t264: เมื่อบีบอัดไม่สำเร็จ จะพักการลองเพิ่มเติม 10 นาทีเพื่อไม่เรียก API ถี่เกินไป
tips.t265: คำสั่งที่มีความเสี่ยงและยาวกว่า 70 ตัวอักษรมีตัวเลือก 'view' ในคำขออนุญาตเพื่อดูข้อความเต็มก่อน
tips.t266: ขณะบันทึกเสียงจะแสดงระดับเสียงเป็นแถบ ▁▂▃▄▅▆▇ ตามค่า RMS ของไมโครโฟน
tips.t267: ชื่อโปรไฟล์ต้องไม่ซ้ำโปรแกรมที่มีอยู่ใน PATH — 'hermes profile create ls' จะถูกปฏิเสธ
tips.t268: hermes profile create backup --clone-all คัดลอกทุกอย่าง (การตั้งค่า คีย์ SOUL.md ความจำ ทักษะ และบทสนทนา)
tips.t269: กำหนดปุ่มบันทึกเสียงได้ด้วย voice.record_key ใน config.yaml — ไม่จำกัดเพียง Ctrl+B
tips.t270: ตรวจพบและโหลด .cursorrules กับ .cursor/rules/*.mdc เป็นบริบทโปรเจกต์อัตโนมัติ
tips.t271: ไฟล์บริบทรองรับการตรวจรูปแบบแทรกคำสั่งกว่า 10 แบบ — Unicode ที่มองไม่เห็น 'ignore instructions'
  และความพยายามลักลอบส่งข้อมูล
tips.t272: GPT-5 และ Codex ใช้บทบาท 'developer' แทน 'system' ในรูปแบบข้อความ
tips.t273: กำหนดงานเสริมแยกแต่ละงานด้วย auxiliary.vision.provider, auxiliary.compression.model ฯลฯ ใน config.yaml
tips.t274: ไคลเอนต์งานเสริมใช้ 'main' เป็นชื่อเรียกผู้ให้บริการ — แปลงเป็นผู้ให้บริการหลักและโมเดลจริงของคุณ
tips.t275: hermes import-agent openclaw --dry-run แสดงตัวอย่างการย้าย OpenClaw โดยไม่เขียนข้อมูล
tips.t276: จัดการพาธไฟล์ที่วางพร้อมเครื่องหมายคำพูดหรือช่องว่างที่ escape แล้วอัตโนมัติ — ไม่ต้องแก้เอง
tips.t277: คำสั่งสแลชไม่ถูกย่อแบบข้อความวางขนาดใหญ่ — /command พร้อมอาร์กิวเมนต์ยาวยังทำงานถูกต้อง
tips.t278: ในโหมดขัดจังหวะ คำสั่งสแลชที่พิมพ์ขณะเอเจนต์ทำงานจะข้ามขั้นขัดจังหวะและทำงานทันที
tips.t279: HERMES_DEV=1 ข้ามการตรวจโหมดคอนเทนเนอร์สำหรับการพัฒนาในเครื่อง
tips.t280: แต่ละเซิร์ฟเวอร์ MCP มีชุดเครื่องมือของตัวเอง (mcp-servername) เปิด/ปิดแยกกันได้ด้วย hermes tools
tips.t281: ตัวแทน ${ENV_VAR} ของ MCP ในการตั้งค่าถูกแทนเมื่อเริ่มเซิร์ฟเวอร์ — รวมตัวแปรจากไฟล์ .env ของ Hermes
tips.t282: ทักษะจากที่เก็บที่เชื่อถือ (NousResearch) ได้ระดับความปลอดภัย 'trusted'; ทักษะชุมชนได้รับการตรวจเพิ่มเติม
tips.t283: พื้นที่กักกันทักษะ skills/.hub/quarantine/ ในไดเรกทอรีหลัก Hermes เก็บทักษะที่รอตรวจความปลอดภัย
tips.t284: /steer <prompt> แทรกหมายเหตุหลังเรียกเครื่องมือครั้งถัดไป — ปรับทิศทางกลางงานโดยไม่ขัดจังหวะ
tips.t285: /goal <text> ตั้งเป้าหมายต่อเนื่องแบบ Ralph-loop — Hermes ทำรอบถัดไปอัตโนมัติจนผู้ประเมินระบุว่าเสร็จ
tips.t286: /snapshot create [label] บันทึกภาพสถานะการตั้งค่า Hermes ทั้งหมด; /snapshot restore <id> คืนค่าภายหลัง
tips.t287: /copy [N] คัดลอกคำตอบล่าสุดของผู้ช่วยลงคลิปบอร์ด หรือระบุตัวเลขเพื่อคัดลอกคำตอบที่ N นับจากท้าย
tips.t288: /redraw บังคับวาด UI ใหม่ทั้งหมด แก้หน้าจอเหลื่อมหลังปรับขนาด tmux หรือผลค้างจากการเลือกด้วยเมาส์
tips.t289: /agents (ชื่อเรียกอื่น /tasks) แสดงเอเจนต์ที่ทำงานและงานเบื้องหลังในบทสนทนาปัจจุบัน
tips.t290: /footer เปิด/ปิดส่วนท้ายเกตเวย์ในคำตอบสุดท้ายที่แสดงโมเดล เปอร์เซ็นต์บริบท และ cwd
tips.t291: /busy queue|steer|interrupt ควบคุมผลของการกด Enter ขณะ Hermes ทำงาน
tips.t292: /topic ใน Telegram DM เปิดโหมดหัวข้อหลายบทสนทนาที่ผู้ใช้จัดการเอง — /topic <id> คืนบทสนทนาเก่าในแชทเดิม
tips.t293: /approve session|always เรียกคำสั่งที่มีความเสี่ยงซึ่งรออยู่ตามขอบเขตที่คุณอนุญาต; /deny ปฏิเสธ
tips.t294: /restart เริ่มเกตเวย์ใหม่อย่างเป็นขั้นตอนหลังรอให้งานที่ทำอยู่จบ แล้วแจ้งผู้ร้องขอเมื่อกลับมาพร้อม
tips.t295: /kanban boards switch <slug> เปลี่ยนบอร์ด Kanban หลายโปรเจกต์ที่ใช้งานจากในแชท
tips.t296: /reload โหลดไฟล์ .env ของ Hermes ใหม่ในบทสนทนาที่กำลังทำงาน — ใช้ API key ใหม่ได้โดยไม่เริ่มโปรแกรมใหม่
tips.t297: cronjob พร้อม no_agent=True เรียกสคริปต์ตามกำหนดเวลาและส่ง stdout โดยตรง — ไม่ใช้โทเคนและ LLM
tips.t298: stdout ที่ว่างของสคริปต์ cron หมายถึงรอบเงียบ — ไม่ส่งข้อความ เหมาะกับการเฝ้าระวังตามค่าเกณฑ์
tips.t299: HERMES_CRON_MAX_PARALLEL (ค่าเริ่มต้น 4) จำกัดจำนวนงาน cron ต่อรอบ
  เพื่อไม่ให้การใช้งานพร้อมกันทำให้คีย์เต็มขีดจำกัด
tips.t300: ฮุกเกตเวย์อยู่ใน hooks/<name>/ ของไดเรกทอรีหลัก Hermes พร้อม HOOK.yaml + handler.py — ฟังก์ชันจัดการต้องชื่อ
  `handle`
tips.t301: เหตุการณ์ฮุกมี gateway:startup, session:start, agent:step และการสมัครรับแบบไวลด์การ์ด command:*
tips.t302: วางรายการตรวจสอบ BOOT.md ในไดเรกทอรีหลัก Hermes แล้วฮุก gateway:startup
  จะให้เอเจนต์ทำรายการนั้นครั้งเดียวทุกครั้งที่เริ่มระบบ
tips.t303: hermes curator run --dry-run แสดงสิ่งที่ตัวจัดการทักษะจะเก็บถาวรหรือรวม โดยไม่เปลี่ยนข้อมูล
tips.t304: hermes curator pin <skill> ป้องกันทักษะจากทั้งการเก็บถาวรอัตโนมัติและเครื่องมือ skill_manage ของเอเจนต์
tips.t305: hermes curator rollback คืนทักษะจากภาพสถานะก่อนทำงาน — สำเนาอยู่ใน skills/.curator_backups/
tips.t306: hermes auth reset <provider> [target] ล้างเวลาพักและสถานะใช้หมดของชุดข้อมูลรับรองทั้งหมด
  หรือรายการเดียวตามดัชนี รหัส หรือป้ายชื่อ
tips.t307: 'credential_pool_strategies.<provider>: round_robin หมุนเวียนคีย์อย่างทั่วถึงแทนค่าเริ่มต้น fill_first'
tips.t308: 'use_gateway: true แยกตามเครื่องมือ ส่งงานเว็บ ภาพ TTS หรือเบราว์เซอร์ผ่านสมาชิก Nous — ไม่ต้องมีคีย์เพิ่ม'
tips.t309: 'provider_routing.data_collection: deny ไม่เลือกผู้ให้บริการ OpenRouter ที่เก็บข้อมูล'
tips.t310: 'provider_routing.require_parameters: true เลือกเฉพาะผู้ให้บริการที่รองรับทุกพารามิเตอร์ในคำขอ'
tips.t311: HERMES_TUI_RESUME=1 เชื่อมต่อบทสนทนา TUI ล่าสุดอัตโนมัติเมื่อเปิด — สะดวกเมื่อ SSH หลุด
tips.t312: HERMES_TUI_THEME=light|dark|<hex> บังคับธีม TUI บนเทอร์มินัลที่ไม่ตั้ง COLORFGBG
tips.t313: Ctrl+G หรือ Ctrl+X Ctrl+E ใน TUI เปิดข้อความที่กำลังพิมพ์ใน $EDITOR สำหรับพรอมป์ต์หลายบรรทัดที่ยาว
tips.t314: TUI แสดง LaTeX ในบรรทัด — $E=mc^2$ กลายเป็นคณิตศาสตร์ Unicode แทน TeX ดิบ
tips.t315: hermes dashboard เปิดเว็บ UI ในเครื่องที่ 127.0.0.1:9119 — ไม่มีข้อมูลออกจาก localhost
tips.t316: hermes dashboard ฝัง Hermes TUI เต็มรูปแบบในเบราว์เซอร์ผ่าน xterm.js และ WebSocket PTY
tips.t317: วาง YAML ที่มีสีพาเลตสองสีในโฟลเดอร์ dashboard-themes ของ Hermes เพื่อเปลี่ยนธีมแดชบอร์ดทั้งหมด
tips.t318: 'ปลั๊กอินแดชบอร์ดใช้แบบวางไฟล์ได้: manifest.json + ชุด JS ในโฟลเดอร์ dashboard-plugins ของ Hermes — ไม่ต้อง build
  ด้วย npm'
tips.t319: 'layoutVariant: cockpit ในธีมแดชบอร์ดเพิ่มแถบซ้ายกว้าง 260px ที่ปลั๊กอินใส่เนื้อหาผ่านช่อง sidebar ได้'
tips.t320: 'display.tool_progress_command: true เปิด /verbose บนแพลตฟอร์มข้อความ; ค่าเริ่มต้นใช้ได้เฉพาะ CLI'
tips.t321: HERMES_BACKGROUND_NOTIFICATIONS=result แจ้งเฉพาะเมื่องานเบื้องหลังเสร็จ (ตัวเลือกอื่นคือ
  concise/all/error/off)
tips.t322: 'HERMES_WRITE_SAFE_ROOT จำกัด write_file/patch ตามพาธขึ้นต้นของไดเรกทอรี; ระบุหลายพาธด้วย os.pathsep (: หรือ ;)'
tips.t323: HERMES_IGNORE_RULES ข้ามการแทรก AGENTS.md, SOUL.md, .cursorrules ความจำ และทักษะที่โหลดล่วงหน้าโดยอัตโนมัติ
tips.t324: HERMES_ACCEPT_HOOKS อนุญาตฮุกเชลล์ที่ยังไม่เคยเห็นใน config.yaml อัตโนมัติโดยไม่ถามผ่าน TTY
tips.t325: auxiliary.goal_judge.model เลือกโมเดลที่เร็วและประหยัดให้ผู้ประเมิน /goal เพื่อให้ค่าวนงานใกล้ศูนย์
tips.t326: จุดคืนค่าข้ามไดเรกทอรีที่มีไฟล์มากกว่า 50,000 รายการ เพื่อเลี่ยง Git ที่ช้าบน monorepo ขนาดใหญ่
tips.t327: 'tts.provider: piper ใช้ TTS ในเครื่อง 44 ภาษาบน CPU — ดาวน์โหลดเสียงอัตโนมัติไปยัง cache/piper-voices/ ของ Hermes'
tips.t328: 'tts.providers.<name>.type: command เชื่อมกลไก TTS แบบ CLI ใดก็ได้ด้วยตัวแทน {input_path} และ {output_path}'
tips.t329: API_SERVER_ENABLED=true เปิดปลายทางที่เข้ากันได้กับ OpenAI ควบคู่กับเกตเวย์สำหรับ Open WebUI และ LibreChat
tips.t330: 'GATEWAY_PROXY_URL ใช้การติดตั้งแยกส่วน: รับส่งข้อมูลแพลตฟอร์มในเครื่อง และมอบงานเอเจนต์ให้เซิร์ฟเวอร์ API ระยะไกล'
tips.t331: MATRIX_DEVICE_ID กำหนดรหัสอุปกรณ์คงที่สำหรับ E2EE — หากไม่มี
  คีย์จะเปลี่ยนทุกครั้งที่เริ่มและถอดรหัสประวัติเดิมไม่ได้
tips.t332: ต้องมี TELEGRAM_WEBHOOK_SECRET เมื่อตั้ง TELEGRAM_WEBHOOK_URL — สร้างด้วย openssl rand -hex 32
tips.t333: batch_runner.py --resume จับคู่พรอมป์ต์ที่ทำเสร็จตามเนื้อหาข้อความ
  การเรียงชุดข้อมูลใหม่จึงไม่เรียกงานที่เสร็จแล้วซ้ำ
tips.t334: /new เริ่มบทสนทนาใหม่ในที่เดิม (ชื่อเรียกอื่น /reset) — รหัสใหม่ ประวัติว่าง และ CLI ยังเปิดอยู่
tips.t335: /clear ล้างหน้าจอเทอร์มินัลและเริ่มบทสนทนาใหม่ — ใช้คำสั่งเดียวเพื่อรีเซ็ตหน้าจอ
tips.t336: /history แสดงบทสนทนาปัจจุบันในหน้าจอเดิมโดยไม่ออกจาก CLI — เหมาะสำหรับอ่านทบทวนเร็ว ๆ
tips.t337: /save บันทึกบทสนทนาปัจจุบันลงดิสก์โดยไม่จบบทสนทนา
tips.t338: '/status แสดงข้อมูลบทสนทนาโดยย่อ: รหัส ชื่อ โมเดล การใช้โทเคน และเวลาที่ผ่านไป'
tips.t339: /image <path> แนบภาพในเครื่องสำหรับพรอมป์ต์ถัดไปโดยไม่ต้องวางหรือลากไฟล์
tips.t340: /platforms แสดงสถานะเกตเวย์และการเชื่อมต่อแพลตฟอร์มข้อความได้จากในแชท
tips.t341: /commands แสดงรายการคำสั่งสแลชและทักษะที่ติดตั้งทั้งหมดแบบแบ่งหน้า — เหมาะกับแพลตฟอร์มที่ไม่มีการเติมด้วย Tab
tips.t342: /toolsets แสดงชุดเครื่องมือที่ใช้ได้ทั้งหมดเพื่อให้ทราบว่า -t/--toolsets รับค่าใดได้
tips.t343: /voice tts เปิด/ปิดโหมด TTS อย่างเดียว — เอเจนต์ตอบด้วยเสียง แต่คุณยังพิมพ์พรอมป์ต์
tips.t344: /reload-skills สแกนโฟลเดอร์ skills ของ Hermes ใหม่ เพื่อให้ทักษะที่วางเพิ่มปรากฏโดยไม่เริ่มบทสนทนาใหม่
tips.t345: /indicator kaomoji|emoji|unicode|ascii เลือกรูปแบบตัวบอกสถานะไม่ว่างของ TUI ขณะเอเจนต์ทำงาน
tips.t346: /debug อัปโหลดชุดข้อมูลสนับสนุน (ข้อมูลระบบ + บันทึก) และคืนลิงก์ที่แชร์ได้ — ใช้ในแชทได้ด้วย
tips.t347: 'hermes -z "<prompt>" ทำคำขอครั้งเดียวแบบเรียบง่ายที่สุด: ส่งเฉพาะคำตอบสุดท้ายไป stdout — เหมาะกับการต่อไปป์ในสคริปต์'
tips.t348: hermes chat --pass-session-id แทรกรหัสบทสนทนาในพรอมป์ต์ระบบเพื่อให้เอเจนต์อ้างถึงตัวเองได้
tips.t349: hermes chat --image path/to/pic.png แนบภาพในเครื่องกับคำขอ -q ครั้งเดียวโดยไม่ต้องอัปโหลดแยก
tips.t350: hermes chat --ignore-user-config ข้ามการตั้งค่าผู้ใช้ที่ใช้งาน — เหมาะกับการทำซ้ำบั๊กและการทำงาน CI
tips.t351: hermes chat --source tool ติดป้ายแชทจากโปรแกรมเพื่อไม่ให้ปะปนใน hermes sessions list
tips.t352: hermes dump --show-keys รวมลายนิ้วมือ API key ที่ปกปิดแล้วเพื่อช่วยตรวจปัญหาเชิงลึก
tips.t353: hermes sessions rename <ID> "new title" เปลี่ยนชื่อบทสนทนาเก่า; hermes sessions delete <ID> ลบบทสนทนา
tips.t354: hermes import คืนค่าจาก ZIP สำรอง Hermes ทั้งหมด; ไฟล์บทสนทนา JSON/JSONL นำเข้าจากหน้า Sessions ในแดชบอร์ด
tips.t355: hermes fallback จัดการลำดับ fallback_model แบบโต้ตอบ — ไม่ต้องแก้ config.yaml เอง
tips.t356: hermes pairing เปลี่ยนโทเคนจับคู่ DM — ผู้ส่งข้อความคนแรกหลังเปลี่ยนจะได้รับสิทธิ์เข้าถึงบอต
tips.t357: hermes setup แนะนำผู้ใช้ใหม่ให้ตั้งผู้ให้บริการ คีย์ และแพลตฟอร์มในขั้นตอนโต้ตอบเดียว
tips.t358: hermes status --deep ตรวจสุขภาพทุกองค์ประกอบอย่างครบถ้วน; hermes status ปกติแสดงแบบย่อ
tips.t359: HERMES_AGENT_TIMEOUT=0 ปิดการหยุดเอเจนต์ที่กำลังทำงานเมื่อเกตเวย์ไม่พบกิจกรรม — ใช้กับงานวิจัยที่ยาวนาน
tips.t360: HERMES_ENABLE_PROJECT_PLUGINS=1 โหลดปลั๊กอินในที่เก็บโค้ดจาก ./.hermes/plugins/ อัตโนมัติ —
  ต้องผ่านการให้ความเชื่อถือก่อนตามการออกแบบ
tips.t361: HERMES_DISABLE_FILE_STATE_GUARD=1 ปิดการป้องกัน 'ไฟล์เปลี่ยนหลังอ่าน' ของ patch และ write_file
tips.t362: HERMES_ALLOW_PRIVATE_URLS=true ให้เครื่องมือเว็บเข้าถึง localhost และเครือข่ายส่วนตัว —
  ปิดตามค่าเริ่มต้นในโหมดเกตเวย์
tips.t363: HERMES_OPTIONAL_SKILLS=name1,name2
  ติดตั้งทักษะเพิ่มเติมจากแค็ตตาล็อกเสริมอัตโนมัติเมื่อเปิดแต่ละโปรไฟล์ครั้งแรก
tips.t364: HERMES_BUNDLED_SKILLS ชี้ไปยังโครงสร้างทักษะที่มาพร้อมโปรแกรมแบบกำหนดเอง — ใช้กับการทำแพ็กเกจ Homebrew และ
  Nix
tips.t365: HERMES_DUMP_REQUEST_STDOUT=1 แสดงข้อมูลทุกคำขอ API ทาง stdout แทนไฟล์บันทึก
tips.t366: HERMES_OAUTH_TRACE=1 บันทึกการแลกและรีเฟรชโทเคน OAuth แบบปกปิดข้อมูล เพื่อแก้ปัญหาการยืนยันตัวตนผู้ให้บริการ
tips.t367: HERMES_STREAM_RETRIES (ค่าเริ่มต้น 3) ควบคุมจำนวนครั้งที่เชื่อมต่อใหม่กลางสตรีมเมื่อเครือข่ายขัดข้องชั่วคราว
tips.t368: HERMES_GATEWAY_BUSY_ACK_ENABLED=false ปิดข้อความรับทราบ ⚡/⏳/⏩ เมื่อผู้ใช้ส่งข้อความขณะเอเจนต์ไม่ว่าง
tips.t369: HERMES_AGENT_NOTIFY_INTERVAL (ค่าเริ่มต้น 180 วินาที) กำหนดความถี่ที่เกตเวย์แจ้งความคืบหน้าระหว่างรอบที่ยาว
tips.t370: HERMES_RESTART_DRAIN_TIMEOUT (ค่าเริ่มต้น 900 วินาที) จำกัดเวลาที่ /restart รอให้งานที่ทำอยู่จบก่อนบังคับ
tips.t371: HERMES_CHECKPOINT_TIMEOUT (ค่าเริ่มต้น 30 วินาที) จำกัดเวลาสร้างจุดคืนค่าระบบไฟล์ — เพิ่มค่าเมื่อใช้ monorepo
  ขนาดใหญ่
tips.t372: 'image_gen.model ใน config.yaml เลือกโมเดล FAL: flux-2/klein, gpt-image-2, nano-banana-pro และอื่น ๆ'
tips.t373: image_gen.provider ส่งการสร้างภาพผ่านปลั๊กอิน (OpenAI Images, Codex, FAL) แทนระบบเริ่มต้น
tips.t374: AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY กำหนดให้วิเคราะห์ภาพผ่านปลายทางที่เข้ากันได้กับ OpenAI
tips.t375: API_SERVER_MODEL_NAME ปรับชื่อโมเดลบน /v1/models — จำเป็นสำหรับการใช้ Open WebUI หลายโปรไฟล์
tips.t376: ปลั๊กอินแดชบอร์ดให้บริการจาก /dashboard-plugins/<name>/ — วางไฟล์ในโฟลเดอร์ dashboard-plugins ของ Hermes
tips.t377: แชท --source tool ไม่ปรากฏใน hermes sessions list ตามค่าเริ่มต้น — ระบุ --source อย่างชัดเจนเพื่อดู
tips.placeholder.p01: ถามได้ทุกเรื่อง หรือพิมพ์ / เพื่อดูคำสั่ง…
tips.placeholder.p02: สรุปสิ่งที่อยู่ในโฟลเดอร์นี้
tips.placeholder.p03: ร่างคำตอบอีเมลล่าสุดในกล่องขาเข้าของฉัน
tips.placeholder.p04: วางแผนฟีเจอร์แล้วสร้างทีละขั้นตอน
tips.placeholder.p05: ค้นหาและแก้การทดสอบที่ไม่ผ่าน
tips.placeholder.p06: ค้นคว้าหัวข้อนี้และเขียนสรุปให้ฉัน
tips.placeholder.p07: ที่เก็บโค้ดนี้มีอะไรเปลี่ยนไปบ้างล่าสุด
tips.placeholder.p08: เปลี่ยนบันทึกเหล่านี้เป็นรายการสิ่งที่ต้องทำ
tips.placeholder.p09: อธิบายข้อผิดพลาดนี้และวิธีแก้
tips.placeholder.p10: ตั้งการแจ้งเตือนหรือกำหนดงานที่ทำซ้ำ
tips.placeholder.p11: พิมพ์ / เพื่อดูคำสั่ง หรือ Ctrl+P เพื่อเปิดแผงคำสั่ง
