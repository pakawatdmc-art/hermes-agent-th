gateway.startup.db_corrupt: "⚠️ ตรวจพบฐานข้อมูลบทสนทนาเสียหาย ข้อความอาจไม่ถูกบันทึก วิธีการกู้คืน:\n1. เรียกใช้ `hermes {profile_arg}doctor
  --fix`\n2. หยุดเกตเวย์ แล้วกู้คืนด้วย:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (หากรายงานว่ากู้คืนได้)
  hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — การกู้คืนจะสำเนาไฟล์ที่เสียหายไว้ก่อน
  ห้ามใช้ `sqlite3 ... \".recover\"` กับ state.db ที่กำลังใช้งาน เพราะ sqlite3 CLI ที่มีช่องโหว่อาจทำให้เสียหายยิ่งขึ้น\n\
  3. กู้คืนจากไฟล์สำรองใน {backups_dir}/\nเรียกใช้ `hermes {profile_arg}doctor` เพื่อดูผลวินิจฉัยที่ปกปิดข้อมูลอ่อนไหวแล้ว"
gateway.startup.db_fts_corrupt: '⚠️ ฐานข้อมูลบทสนทนารายงานความเสียหายเฉพาะดัชนีค้นหา (FTS5) ตารางข้อความไม่เสียหาย ข้อความอาจไม่ถูกบันทึกจนกว่าจะแก้ไข:
  เรียกใช้ `hermes {profile_arg}doctor --fix` แล้วเริ่มเกตเวย์ใหม่ อย่าใช้เครื่องมือกู้คืนหรือคืนไฟล์สำรอง เว้นแต่ `hermes
  {profile_arg}doctor` ยืนยันว่ามีความเสียหาย'
gateway.startup.db_then_restart: '{action} จากนั้นใช้ `hermes {profile_arg}gateway restart`'
