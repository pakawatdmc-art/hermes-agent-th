cli.subscription.pending_scheduled: กำหนดการเปลี่ยนแพ็กเกจแล้ว — วันนี้แพ็กเกจยังไม่เปลี่ยน
  คุณใช้แพ็กเกจเดิมได้จนสิ้นสุดรอบเรียกเก็บเงิน แล้วจึงเปลี่ยน
cli.subscription.pending_cancel_scheduled: กำหนดการยกเลิกแล้ว — คุณยังใช้แพ็กเกจได้จนสิ้นสุดรอบเรียกเก็บเงิน
  แล้วจึงยกเลิก วันนี้ยังไม่มีการเปลี่ยนแปลง
cli.subscription.pending_resumed: ยกเลิกการเปลี่ยนแปลงที่รออยู่แล้ว — คุณยังใช้แพ็กเกจปัจจุบันต่อไป
cli.subscription.rerun_to_review: ใช้ /subscription ได้ทุกเมื่อเพื่อตรวจสอบ
cli.subscription.stepup_explain: หากต้องการเปลี่ยนแพ็กเกจจากเทอร์มินัลให้อนุญาตการใช้จ่ายจากระยะไกลครั้งเดียว
  ระบบจะเปิดเบราว์เซอร์เพื่อขออนุญาต แล้วดำเนินการเปลี่ยนแปลงต่อที่นี่
cli.subscription.stepup_noninteractive: รัน `hermes portal` และอนุญาตการใช้จ่ายจากระยะไกล แล้วใช้ /subscription อีกครั้ง
cli.subscription.stepup_declined: ไม่มีการเปลี่ยนแปลง อนุญาตการใช้จ่ายจากระยะไกลเมื่อพร้อม
cli.subscription.stepup_not_granted: อนุญาตการใช้จ่ายจากระยะไกลไม่ได้ —
  ผู้ดูแลหรือเจ้าขององค์กรต้องเป็นผู้อนุมัติสำหรับองค์กรนี้
cli.subscription.remote_spending_not_allowed_yet: 🟡 ยังไม่อนุญาตการใช้จ่ายจากระยะไกล โปรดอนุญาตแล้วลองใหม่
cli.subscription.upgrade_ambiguous: 🟡 ยืนยันการอัปเกรดไม่ได้ —
  บัตรของคุณอาจถูกเรียกเก็บเงินแล้วหรือยังไม่ถูกเรียกเก็บก็ได้
cli.subscription.rerun_to_check_plan: ใช้ /subscription เพื่อตรวจสอบแพ็กเกจก่อนลองอีกครั้ง
