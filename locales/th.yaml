gateway.topic.default_title: แชต Hermes
gateway.topic.root_lobby: "แชตหลักนี้สงวนไว้สำหรับคำสั่งระบบ\n\nหากต้องการเริ่มแชต Hermes ใหม่ ให้เปิดหัวข้อ All Messages
  ด้านบนหน้าบอตแล้วส่งข้อความ Telegram จะสร้างหัวข้อใหม่สำหรับข้อความนั้น แต่ละหัวข้อเป็นบทสนทนา Hermes แยกต่างหาก"
gateway.topic.root_new: "หากต้องการเริ่มแชต Hermes ใหม่แบบคู่ขนาน ให้เปิดหัวข้อ All Messages ด้านบนหน้าบอตแล้วส่งข้อความ Telegram
  จะสร้างหัวข้อใหม่ให้\n\nแต่ละหัวข้อเป็นบทสนทนา Hermes แยกต่างหาก ใช้ /new ในหัวข้อเดิมเฉพาะเมื่อต้องการแทนบทสนทนาปัจจุบันของหัวข้อนั้น"
gateway.topic.new_header: "เริ่มบทสนทนา Hermes ใหม่ในหัวข้อนี้แล้ว\n\nเคล็ดลับ: หากต้องการทำงานคู่ขนาน ให้เปิด All Messages
  แล้วส่งข้อความเพื่อสร้างหัวข้อแยก แทนการใช้ /new ที่นี่ เพราะ /new จะแทนบทสนทนาของหัวข้อปัจจุบัน"
gateway.topic.help: "/topic — เปิดโหมดหลายบทสนทนาในข้อความส่วนตัว (บอตเดียว หลายแชตพร้อมกัน)\n\nวิธีใช้:\n  /topic       \
  \      เปิดโหมดหัวข้อ หรือดูสถานะหากเปิดแล้ว\n  /topic help        แสดงข้อความนี้\n  /topic off         ปิดโหมดหัวข้อและล้างการเชื่อมบทสนทนา\n\
  \  /topic <id>        ใช้ภายในหัวข้อ: กู้คืนบทสนทนาเดิมตามรหัส\n\nวิธีทำงาน:\n1. ใช้ /topic หนึ่งครั้งในแชตส่วนตัวนี้ Hermes
  จะตรวจว่าเปิด Threads\n   Settings ใน BotFather แล้ว จากนั้นเปิดโหมดหลายบทสนทนา\n2. แตะ All Messages ด้านบนบอตแล้วส่งข้อความ
  Telegram จะสร้าง\n   หัวข้อใหม่สำหรับข้อความนั้น แต่ละหัวข้อมีบทสนทนา Hermes\n   แยกต่างหาก (ประวัติและบริบทใหม่)\n3. แชตส่วนตัวหลักกลายเป็นห้องระบบ
  ใช้ /topic, /status,\n   /help, /usage ที่นั่น ส่วนพรอมป์ต์ปกติให้ส่งในหัวข้อ\n4. /new ภายในหัวข้อจะรีเซ็ตเฉพาะบทสนทนาของหัวข้อนั้น\n\
  5. /topic <id> ภายในหัวข้อจะกู้คืนบทสนทนาเก่ามาไว้ในหัวข้อนั้น"
